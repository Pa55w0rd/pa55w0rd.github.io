<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">覆盖的分母与收官门禁</title><desc id="desc">文件是否检查过，与安全语义是否核验充分，需要同时回答。。reviewed 表示有检查与引用支持；ready_for_review 表示材料可复核，均不自动证明安全。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="850" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 03</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">机制示意</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">覆盖的分母与收官门禁</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">文件是否检查过，与安全语义是否核验充分，需要同时回答。</tspan></text><path d="M44 768 H1156" stroke="#d9e3e9"/><text x="44" y="804" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">reviewed 表示有检查与引用支持；ready_for_review 表示材料可复核，均不自动证明安全。</tspan></text><rect x="44" y="185" width="510" height="360" rx="20" fill="#f5f8fa" stroke="#d9e3e9" stroke-width="1.5"/><text x="64" y="219" font-size="24" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="64" dy="0">文件覆盖：宿主枚举完整清单</tspan></text><rect x="624" y="185" width="532" height="360" rx="20" fill="#f5f8fa" stroke="#d9e3e9" stroke-width="1.5"/><text x="644" y="219" font-size="24" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="644" dy="0">语义覆盖：逐项记录核验状态</tspan></text><path d="M299 545 L299 578 L440 578 L440 595" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M890 545 L890 578 L760 578 L760 595" fill="none" stroke="#087f80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/><rect x="70" y="250" width="458" height="78" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="70" y="267" width="5" height="44" rx="2.5" fill="#a76812"/><text x="90" y="276.86" font-size="23" font-weight="700" fill="#a76812" text-anchor="start"><tspan x="90" dy="0">pending：待审</tspan></text><text x="90" y="306.91999999999996" font-size="18" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="90" dy="0">缺少足够检查记录</tspan></text><rect x="70" y="350" width="458" height="78" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="70" y="367" width="5" height="44" rx="2.5" fill="#2563a8"/><text x="90" y="376.86" font-size="23" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="90" dy="0">reviewed：已核验检查</tspan></text><text x="90" y="406.91999999999996" font-size="18" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="90" dy="0">保留语义证据与源码引用</tspan></text><rect x="70" y="450" width="458" height="78" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="70" y="467" width="5" height="44" rx="2.5" fill="#2563a8"/><text x="90" y="476.86" font-size="23" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="90" dy="0">excluded：范围排除</tspan></text><text x="90" y="506.91999999999996" font-size="18" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="90" dy="0">单列依据，不冒充已审</tspan></text><rect x="260" y="605" width="680" height="138" rx="16" fill="#e9f7f3" stroke="#d9e3e9" stroke-width="1.5"/><rect x="260" y="622" width="5" height="104" rx="2.5" fill="#087f80"/><text x="280" y="648.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="280" dy="0">当前材料的收官检查</tspan></text><text x="280" y="691.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="280" dy="0">覆盖 + 证据 + 反证 + PoC 材料 + 报告版本</tspan></text><text x="654" y="277" font-size="28" font-weight="600" fill="#087f80" text-anchor="start"><tspan x="654" dy="0">01  真实入口</tspan></text><text x="654" y="325" font-size="28" font-weight="600" fill="#087f80" text-anchor="start"><tspan x="654" dy="0">02  信任边界</tspan></text><text x="654" y="373" font-size="28" font-weight="600" fill="#087f80" text-anchor="start"><tspan x="654" dy="0">03  子系统</tspan></text><text x="654" y="421" font-size="28" font-weight="600" fill="#087f80" text-anchor="start"><tspan x="654" dy="0">04  攻击类别</tspan></text><text x="654" y="469" font-size="28" font-weight="600" fill="#087f80" text-anchor="start"><tspan x="654" dy="0">05  生命周期</tspan></text></svg>