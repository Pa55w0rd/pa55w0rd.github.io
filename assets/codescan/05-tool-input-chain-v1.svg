<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">空参数报错：先定位失败发生在哪一层</title><desc id="desc">同一句“工具调用失败”，可能出现在不同的接收与保存阶段。。缺少匹配原始报文时，不能仅凭 {} 判断是模型、协议转换还是参数组装丢失。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="880" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 05</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">机制示意</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">空参数报错：先定位失败发生在哪一层</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">同一句“工具调用失败”，可能出现在不同的接收与保存阶段。</tspan></text><path d="M44 798 H1156" stroke="#d9e3e9"/><text x="44" y="834" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">缺少匹配原始报文时，不能仅凭 {} 判断是模型、协议转换还是参数组装丢失。</tspan></text><path d="M376 263 L424 263" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M766 263