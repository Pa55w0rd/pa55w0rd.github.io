<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">一次计量记录，对应一次 Provider 调用</title><desc id="desc">开始与结束时间回答何时发生，单调计时回答实际经过多久。。SDK 内部重试可能合并在一次 Provider 调用内；历史缺失时间保持未知。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="820" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 07</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">机制示意</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">一次计量记录，对应一次 Provider 调用</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">开始与结束时间回答何时发生，单调计时回答实际经过多久。</tspan></text><path d="M44 738 H1156" stroke="#d9e3e9"/><text x="44" y="774" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">SDK 内部重试可能合并在一次 Provider 调用内；历史缺失时间保持未知。</tspan></text><rect x="70" y="244" width="1060" height="165" rx="18" fill="#edf4fc" stroke="#d9e3e9" stroke-width="1.5"/><path d="M330 409 L330 470" fill="none" stroke="#087f80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M870 409 L870 470" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-blue)"/><rect x="70" y="480" width="500" height="158" rx="16" fill="#e9f7f3" stroke="#d9e3e9" stroke-width="1.5"/><rect x="70" y="497" width="5" height="124" rx="2.5" fill="#087f80"/><text x="90" y="523.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="90" dy="0">轻量 usage 账本</tspan></text><text x="90" y="566.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="90" dy="0">started_at / completed_at</tspan><tspan x="90" dy="32.199999999999996">耗时、token、缓存与状态</tspan></text><rect x="630" y="480" width="500" height="158" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="630" y="497" width="5" height="124" rx="2.5" fill="#2563a8"/><text x="650" y="523.78" font-size="29" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="650" dy="0">原文录制：可选</tspan></text><text x="650" y="566.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="650" dy="0">请求与响应正文</tspan><tspan x="650" dy="32.199999999999996">与计量共用时间边界</tspan></text><text x="70" y="215" font-size="25" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="70" dy="0">调用边界</tspan></text><text x="104" y="285" font-size="25" font-weight="600" fill="#2563a8" text-anchor="start"><tspan x="104" dy="0">开始边界：Stream 消费或 Complete 调用</tspan></text><text x="104" y="331" font-size="28" font-weight="400" fill="#142b3d" text-anchor="start"><tspan x="104" dy="0">SDK 建连 / 内部重试 → 响应与流式消费</tspan></text><text x="104" y="377" font-size="25" font-weight="600" fill="#2563a8" text-anchor="start"><tspan x="104" dy="0">结束边界：成功、失败或取消时结束调用</tspan></text><text x="600" y="697" font-size="27" font-weight="400" fill="#536a7c" text-anchor="middle"><tspan x="600" dy="0">计量完成后再写库，保存耗时不计入模型调用</tspan></text></svg>