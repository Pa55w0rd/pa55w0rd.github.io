<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">长程任务：每次只推进一个可验收批次</title><desc id="desc">完整材料保留在持久层，上下文只带当前需要的部分。。4096 / 8192 是客户端默认输出上限，尊重更小配置；不改变远端窗口或并发。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="850" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 08</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">机制示意</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">长程任务：每次只推进一个可验收批次</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">完整材料保留在持久层，上下文只带当前需要的部分。</tspan></text><path d="M44 768 H1156" stroke="#d9e3e9"/><text x="44" y="804" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">4096 / 8192 是客户端默认输出上限，尊重更小配置；不改变远端窗口或并发。</tspan></text><path d="M376 285 L424 285" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M766 285 L814 285" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M990 375 L990 434 L390 434 L390 472" fill="none" stroke="#087f80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M565 559 L655 559" fill="none" stroke="#087f80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M840 636 L840 682 L24 682 L24 285 L34 285" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><rect x="44" y="195" width="332" height="180" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="212" width="5" height="146" rx="2.5" fill="#2563a8"/><text x="64" y="237.96" font-size="28" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="64" dy="0">完整材料</tspan></text><text x="64" y="279.32000000000005" font-size="22" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">源码清单、威胁模型</tspan><tspan x="64" dy="30.799999999999997">证据与覆盖账本</tspan><tspan x="64" dy="30.799999999999997">持久保存与版本绑定</tspan></text><rect x="434" y="195" width="332" height="180" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="434" y="212" width="5" height="146" rx="2.5" fill="#2563a8"/><text x="454" y="237.96" font-size="28" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="454" dy="0">本次上下文</tspan></text><text x="454" y="279.32000000000005" font-size="22" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="454" dy="0">分页 / 指定文件</tspan><tspan x="454" dy="30.799999999999997">当前入口调用链</tspan><tspan x="454" dy="30.799999999999997">工具回执与剩余缺口</tspan></text><rect x="824" y="195" width="332" height="180" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="824" y="212" width="5" height="146" rx="2.5" fill="#087f80"/><text x="844" y="237.96" font-size="28" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="844" dy="0">有界输出</tspan></text><text x="844" y="279.32000000000005" font-size="22" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="844" dy="0">目标拆解 ≤ 4096</tspan><tspan x="844" dy="30.799999999999997">其他角色 ≤ 8192</tspan><tspan x="844" dy="30.799999999999997">再受窗口四分之一约束</tspan></text><rect x="215" y="482" width="350" height="154" rx="16" fill="#e9f7f3" stroke="#d9e3e9" stroke-width="1.5"/><rect x="215" y="499" width="5" height="120" rx="2.5" fill="#087f80"/><text x="235" y="525.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="235" dy="0">保存本批进展</tspan></text><text x="235" y="568.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="235" dy="0">证据、版本、范围</tspan><tspan x="235" dy="32.199999999999996">未知项与下一步</tspan></text><rect x="665" y="482" width="350" height="154" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="665" y="499" width="5" height="120" rx="2.5" fill="#087f80"/><text x="685" y="525.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="685" dy="0">继续下一个批次</tspan></text><text x="685" y="568.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="685" dy="0">先读取断点与缺口</tspan><tspan x="685" dy="32.199999999999996">摘要仅用于导航</tspan></text></svg>