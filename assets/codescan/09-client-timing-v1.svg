<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">TTFT 与吞吐：客户端究竟观测到什么</title><desc id="desc">以首个有效正文、推理或工具事件为界；角色、空帧、用量帧不计入。。速率含排队、网络和缓冲影响，是客户端估算；失败、用量不全或节奏不可见时保留未知。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="900" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 09</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">机制示意</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">TTFT 与吞吐：客户端究竟观测到什么</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">以首个有效正文、推理或工具事件为界；角色、空帧、用量帧不计入。</tspan></text><path d="M44 818 H1156" stroke="#d9e3e9"/><text x="44" y="854" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">速率含排队、网络和缓冲影响，是客户端估算；失败、用量不全或节奏不可见时保留未知。</tspan></text><rect x="70" y="300" width="1060" height="70" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="70" y="300" width="345" height="70" rx="12" fill="#fff5e6" stroke="#fff5e6" stroke-width="1.5"/><rect x="415" y="300" width="715" height="70" rx="12" fill="#e9f7f3" stroke="#e9f7f3" stroke-width="1.5"/><path d="M70 268 L70 400" stroke="#2563a8" stroke-width="2.5" fill="none"/><path d="M415 268 L415 400" stroke="#2563a8" stroke-width="2.5" fill="none"/><path d="M1130 268 L1130 400" stroke="#2563a8" stroke-width="2.5" fill="none"/><path d="M70 435 L1130 435" stroke="#2563a8" stroke-width="2.5" fill="none"/><rect x="70" y="535" width="1060" height="92" rx="16" fill="#fff5e6" stroke="#d9e3e9" stroke-width="1.5"/><rect x="70" y="552" width="5" height="58" rx="2.5" fill="#a76812"/><text x="90" y="563.5" font-size="25" font-weight="700" fill="#a76812" text-anchor="start"><tspan x="90" dy="0">Prefill 估算</tspan></text><text x="90" y="596" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="90" dy="0">(输入 token − 缓存读取 token) ÷ TTFT 秒数</tspan></text><rect x="70" y="648" width="1060" height="110" rx="16" fill="#e9f7f3" stroke="#d9e3e9" stroke-width="1.5"/><rect x="70" y="665" width="5" height="76" rx="2.5" fill="#087f80"/><text x="90" y="683.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="90" dy="0">Decode 估算</tspan></text><text x="90" y="722.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="90" dy="0">(输出 token − 1) ÷ Decode 秒数；需观测到多个输出事件</tspan></text><text x="70" y="220" font-size="25" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="70" dy="0">t0  请求开始</tspan></text><text x="415" y="212" font-size="25" font-weight="700" fill="#087f80" text-anchor="middle"><tspan x="415" dy="0">t1  首个有效输出</tspan></text><text x="1130" y="220" font-size="25" font-weight="700" fill="#2563a8" text-anchor="end"><tspan x="1130" dy="0">t2  调用结束</tspan></text><text x="242" y="345" font-size="29" font-weight="700" fill="#a76812" text-anchor="middle"><tspan x="242" dy="0">TTFT = t1 − t0</tspan></text><text x="772" y="345" font-size="29" font-weight="700" fill="#087f80" text-anchor="middle"><tspan x="772" dy="0">Decode 区间 = t2 − t1</tspan></text><text x="600" y="475" font-size="28" font-weight="700" fill="#2563a8" text-anchor="middle"><tspan x="600" dy="0">总耗时 = t2 − t0</tspan></text></svg>