<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">三种任务类型，三套完成条件</title><desc id="desc">按交付范围选择模式，完整审计在同一任务内先建模、再审计。。前端默认推荐完整审计；旧 HTTP 调用缺少 task_mode 时保留独立代码审计兼容默认。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="900" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 10</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">机制示意</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">三种任务类型，三套完成条件</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">按交付范围选择模式，完整审计在同一任务内先建模、再审计。</tspan></text><path d="M44 818 H1156" stroke="#d9e3e9"/><text x="44" y="854" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">前端默认推荐完整审计；旧 HTTP 调用缺少 task_mode 时保留独立代码审计兼容默认。</tspan></text><rect x="44" y="185" width="332" height="575" rx="20" fill="#f5f8fa" stroke="#d9e3e9" stroke-width="1.5"/><text x="64" y="219" font-