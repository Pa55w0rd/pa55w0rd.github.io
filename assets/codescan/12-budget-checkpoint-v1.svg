<!-- CodeScan article figures; v1; 2026-11-17 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">运行预算耗尽后，先留下可恢复的交接</title><desc id="desc">停止继续探索，把已经识别的事实、证据和下一步写回。。收尾默认最多 4 轮；timeout 表示宿主预算耗尽，不是任务已完成。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="880" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 12</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">机制示意</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">运行预算耗尽后，先留下可恢复的交接</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">停止继续探索，把已经识别的事实、证据和下一步写回。</tspan></text><path d="M44 798 H1156" stroke="#d9e3e9"/><text x="44" y="834" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">收尾默认最多 4 轮；timeout 表示宿主预算耗尽，不是任务已完成。</tspan></text><path d="M376 262 L424 262" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M766 262 L814 262" fill="none" stroke="#087f80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M990 335 L990 468" fill="none" stroke="#087f80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M824 562 L776 562" fill="none" stroke="#087f80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M434 562 L386 562" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M210 478 L210 345" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a-blue)"/><rect x="44" y="190" width="332" height="145" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="207" width="5" height="111" rx="2.5" fill="#2563a8"/><text x="64" y="233.78" font-size="29" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="64" dy="0">主探索阶段</tspan></text><text x="64" y="276.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">一次意图推进一个批次</tspan></text><rect x="434" y="190" width="332" height="145" rx="16" fill="#fff5e6" stroke="#d9e3e9" stroke-width="1.5"/><rect x="434" y="207" width="5" height="111" rx="2.5" fill="#a76812"/><text x="454" y="233.78" font-size="29" font-weight="700" fill="#a76812" text-anchor="start"><tspan x="454" dy="0">达到 MaxDuration</tspan></text><text x="454" y="276.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="454" dy="0">中断在途探索与工具</tspan></text><rect x="824" y="190" width="332" height="145" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="824" y="207" width="5" height="111" rx="2.5" fill="#087f80"/><text x="844" y="232.14" font-size="27" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="844" dy="0">有限收尾</tspan></text><text x="844" y="272.28" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="844" dy="0">保存已知材料</tspan><tspan x="844" dy="29.4">不再继续读写探索清单</tspan></text><rect x="824" y="478" width="332" height="168" rx="16" fill="#e9f7f3" stroke="#d9e3e9" stroke-width="1.5"/><rect x="824" y="495" width="5" height="134" rx="2.5" fill="#087f80"/><text x="844" y="518.5" font-size="25" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="844" dy="0">持久化断点</tspan></text><text x="844" y="556.2" font-size="19" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="844" dy="0">耗时与预算、保存计数</tspan><tspan x="844" dy="26.599999999999998">最后工具与错误</tspan><tspan x="844" dy="26.599999999999998">证据引用、TODO 摘要</tspan></text><rect x="434" y="478" width="332" height="168" rx="16" fill="#fff5e6" stroke="#d9e3e9" stroke-width="1.5"/><rect x="434" y="495" width="5" height="134" rx="2.5" fill="#a76812"/><text x="454" y="521.78" font-size="29" font-weight="700" fill="#a76812" text-anchor="start"><tspan x="454" dy="0">标记耗尽</tspan></text><text x="454" y="564.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="454" dy="0">exhausted</tspan><tspan x="454" dy="32.199999999999996">不等于 completed</tspan></text><rect x="44" y="478" width="332" height="168" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="495" width="5" height="134" rx="2.5" fill="#2563a8"/><text x="64" y="521.78" font-size="29" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="64" dy="0">恢复下一批</tspan></text><text x="64" y="564.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">先读断点，修正阻塞</tspan><tspan x="64" dy="32.199999999999996">缩小范围后再推进</tspan></text><text x="600" y="729" font-size="25" font-weight="400" fill="#b34b46" text-anchor="middle"><tspan x="600" dy="0">重复错误保护：同工具 + 同参数 + 同错误累计 3 次，提前停止本轮</tspan></text></svg>