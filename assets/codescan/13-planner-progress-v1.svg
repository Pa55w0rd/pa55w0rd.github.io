 x="454" dy="0">再次检查实际进展</tspan></text><text x="454" y="766.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="454" dy="0">以本任务落库变化判断</tspan></text><rect x="824" y="680" width="332" height="146" rx="16" fill="#fff0ec" stroke="#d9e3e9" stroke-width="1.5"/><rect x="824" y="697" width="5" height="112" rx="2.5" fill="#b34b46"/><text x="844" y="722.14" font-size="27" font-weight="700" fill="#b34b46" text-anchor="start"><tspan x="844" dy="0">保护性失败</tspan></text><text x="844" y="762.28" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="844" dy="0">planner_no_progress</tspan><tspan x="844" dy="29.4">保留材料，可恢复</tspan></text><rect x="769" y="213" width="42" height="30" rx="6" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="790" y="234" font-size="20" font-weight="400" fill="#087f80" text-anchor="middle"><tspan x="790" dy="0">有</tspan></text><rect x="559" y="345" width="82" height="30" rx="6" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="600" y="366" font-size="20" font-weight="400" fill="#2563a8" text-anchor="middle"><tspan x="600" dy="0">无活动</tspan></text><rect x="769" y="445" width="42" height="30" rx="6" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="790" y="466" font-size="20" font-weight="400" fill="#087f80" text-anchor="middle"><tspan x="790" dy="0">有</tspan></text><rect x="169" y="570" width="82" height="30" rx="6" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="210" y="591" font-size="20" font-weight="400" fill="#a76812" text-anchor="middle"><tspan x="210" dy="0">无进展</tspan></text><rect x="739" y="712" width="102" height="30" rx="6" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="790" y="733" font-size="20" font-weight="400" fill="#b34b46" text-anchor="middle"><tspan x="790" dy="0">仍未推进</tspan></text><rect x="749" y="594" width="102" height="30" rx="6" fill="#fff" stroke="#fff" stroke-width="1.5"/><text x="800" y="615" font-size="20" font-weight="400" fill="#087f80" text-an