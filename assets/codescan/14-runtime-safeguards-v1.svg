<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">四类运行问题，对应四组保护</title><desc id="desc">时间、错误、服务故障与局部保存各自有明确边界。。这些是当轮默认保护与材料规则，不是长程任务的效果或成本评测。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="900" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 14</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">机制示意</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">四类运行问题，对应四组保护</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">时间、错误、服务故障与局部保存各自有明确边界。</tspan></text><path d="M44 818 H1156" stroke="#d9e3e9"/><text x="44" y="854" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">这些是当轮默认保护与材料规则，不是长程任务的效果或成本评测。</tspan></text><path d="M434 248 L512 248" fill="none" stroke="#2563a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M434 388 L512 388" fill="none" stroke="#a76812" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-amber)"/><path d="M434 528 L512 528" fill="none" stroke="#b34b46" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-red)"/><path d="M434 668 L512 668" fill="none" stroke="#087f80" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-teal)"/><rect x="44" y="190" width="390" height="116" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="207" width="5" height="82" rx="2.5" fill="#2563a8"/><text x="64" y="225.78" font-size="29" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="64" dy="0">规划长时间不退出</tspan></text><text x="64" y="264.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">问题与责任范围分别判断</tspan></text><rect x="522" y="190" width="634" height="116" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="522" y="207" width="5" height="82" rx="2.5" fill="#2563a8"/><text x="542" y="225.78" font-size="29" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="542" dy="0">主探索 ≤ 5 分钟</tspan></text><text x="542" y="264.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="542" dy="0">默认 24 轮，收尾 2 轮</tspan></text><rect x="44" y="330" width="390" height="116" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="347" width="5" height="82" rx="2.5" fill="#a76812"/><text x="64" y="365.78" font-size="29" font-weight="700" fill="#a76812" text-anchor="start"><tspan x="64" dy="0">工具错误持续空转</tspan></text><text x="64" y="404.35999999999996" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">问题与责任范围分别判断</tspan></text><rect x="522" y="330" width="634" height="116" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="522" y="347" width="5" height="82" rx="2.5" fill="#a76812"/><text x="542" y="365.78" font-size="29" font-weight="700" fill="#a76812" text-anchor="start"><tspan x="542" dy="0">同类错误 3 次 / 总错 8 次</tspan></text><text x="542" y="404.35999999999996" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="542" dy="0">及时停止并保存成对轨迹</tspan></text><rect x="44" y="470" width="390" height="116" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="487" width="5" height="82" rx="2.5" fill="#b34b46"/><text x="64" y="505.78" font-size="29" font-weight="700" fill="#b34b46" text-anchor="start"><tspan x="64" dy="0">模型服务连续故障</tspan></text><text x="64" y="544.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">问题与责任范围分别判断</tspan></text><rect x="522" y="470" width="634" height="116" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="522" y="487" width="5" height="82" rx="2.5" fill="#b34b46"/><text x="542" y="505.78" font-size="29" font-weight="700" fill="#b34b46" text-anchor="start"><tspan x="542" dy="0">连续 3 轮模型 / API 失败</tspan></text><text x="542" y="544.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="542" dy="0">停止任务并保留恢复材料</tspan></text><rect x="44" y="610" width="390" height="116" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="627" width="5" height="82" rx="2.5" fill="#087f80"/><text x="64" y="645.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="64" dy="0">局部修改覆盖旧材料</tspan></text><text x="64" y="684.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">问题与责任范围分别判断</tspan></text><rect x="522" y="610" width="634" height="116" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="522" y="627" width="5" height="82" rx="2.5" fill="#087f80"/><text x="542" y="645.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="542" dy="0">ledger_patch / case_patch</tspan></text><text x="542" y="684.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="542" dy="0">保留未改字段，CAS 核对版本</tspan></text><text x="600" y="796" font-size="23" font-weight="400" fill="#536a7c" text-anchor="middle"><tspan x="600" dy="0">报告还需绑定当前 evidence_version；写了本地文件不等于平台报告已更新</tspan></text></svg>