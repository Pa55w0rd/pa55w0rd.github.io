<!-- CodeScan article figures; v1; 2026-11-17 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">借鉴 Mantis：四项候选机制</title><desc id="desc">沿用 Go 架构独立实现，把运行可靠性与效果评测分开。。对应本文记录的候选阶段；最终集成回归、真实模型效果与部署仍需分别验收。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="860" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 15</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">候选阶段</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">借鉴 Mantis：四项候选机制</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">沿用 Go 架构独立实现，把运行可靠性与效果评测分开。</tspan></text><path d="M44 778 H1156" stroke="#d9e3e9"/><text x="44" y="814" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">对应本文记录的候选阶段；最终集成回归、真实模型效果与部署仍需分别验收。</tspan></text><rect x="44" y="190" width="532" height="207" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="207" width="5" height="173" rx="2.5" fill="#2563a8"/><text x="64" y="233.78" font-size="29" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="64" dy="0">版本化工作批次</tspan></text><text x="64" y="276.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">绑定源码、模型、意图与配置</tspan><tspan x="64" dy="32.199999999999996">相同绑定续跑，变化时隔离会话</tspan><tspan x="64" dy="32.199999999999996">finished 不自动形成语义覆盖</tspan></text><rect x="624" y="190" width="532" height="207" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="624" y="207" width="5" height="173" rx="2.5" fill="#087f80"/><text x="644" y="233.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="644" dy="0">跨重启累计预算</tspan></text><text x="644" y="276.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="644" dy="0">数据库原子预占调用与 token</tspan><tspan x="644" dy="32.199999999999996">完整用量返回后再结算</tspan><tspan x="644" dy="32.199999999999996">预占是估计，不是计费账单</tspan></text><rect x="44" y="450" width="532" height="207" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="467" width="5" height="173" rx="2.5" fill="#2563a8"/><text x="64" y="493.78" font-size="29" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="64" dy="0">有边界的源码导航</tspan></text><text x="64" y="536.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">Go：AST 声明与语法调用位置</tspan><tspan x="64" dy="32.199999999999996">其他语言：文本候选</tspan><tspan x="64" dy="32.199999999999996">32 文件 / 2 MiB / 每页 100 项</tspan></text><rect x="624" y="450" width="532" height="207" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="624" y="467" width="5" height="173" rx="2.5" fill="#087f80"/><text x="644" y="493.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="644" dy="0">效果基线起点</tspan></text><text x="644" y="536.36" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="644" dy="0">6 个公开样例，3 组正负对照</tspan><tspan x="644" dy="32.199999999999996">独立人工标注与评分</tspan><tspan x="644" dy="32.199999999999996">计分器通过不等于检出率提升</tspan></text><rect x="330" y="708" width="540" height="52" rx="12" fill="#fff5e6" stroke="#fff5e6" stroke-width="1.5"/><text x="600" y="743" font-size="27" font-weight="700" fill="#a76812" text-anchor="middle"><tspan x="600" dy="0">候选构建 ≠ 已部署 ≠ 效果已验证</tspan></text></svg>