<!-- CodeScan article figures; v1; 2026-11-17 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">定向清理：释放文件，保留运行与证据</title><desc id="desc">按实际盘点与清理回执记录，不把可重建理解成无影响。。5.36 GB 为逻辑文件大小，约 4.99 GiB；实际可用空间变化另行记录。</desc><defs><marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563a8"/></marker><marker id="a-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#087f80"/></marker><marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#a76812"/></marker><marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b34b46"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect width="1200" height="900" fill="#f5f8fa"/><text x="44" y="38" font-size="18" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="44" dy="0">CodeScan 实战 · 16</tspan></text><text x="1156" y="38" font-size="18" font-weight="400" fill="#536a7c" text-anchor="end"><tspan x="1156" dy="0">历史回执</tspan></text><text x="44" y="94" font-size="40" font-weight="700" fill="#142b3d" text-anchor="start"><tspan x="44" dy="0">定向清理：释放文件，保留运行与证据</tspan></text><text x="44" y="135" font-size="21" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">按实际盘点与清理回执记录，不把可重建理解成无影响。</tspan></text><path d="M44 818 H1156" stroke="#d9e3e9"/><text x="44" y="854" font-size="20" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="44" dy="0">5.36 GB 为逻辑文件大小，约 4.99 GiB；实际可用空间变化另行记录。</tspan></text><rect x="44" y="185" width="352" height="145" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><text x="66" y="243" font-size="43" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="66" dy="0">5.36 GB</tspan></text><text x="66" y="288" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="66" dy="0">已删除文件的逻辑大小</tspan></text><rect x="424" y="185" width="352" height="145" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><text x="446" y="243" font-size="43" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="446" dy="0">492 项</tspan></text><text x="446" y="288" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="446" dy="0">本轮删除目标</tspan></text><rect x="804" y="185" width="352" height="145" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><text x="826" y="243" font-size="43" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="826" dy="0">2,219 个</tspan></text><text x="826" y="288" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="826" dy="0">保护文件摘要一致</tspan></text><rect x="44" y="390" width="532" height="270" rx="16" fill="#fff" stroke="#d9e3e9" stroke-width="1.5"/><rect x="44" y="407" width="5" height="236" rx="2.5" fill="#2563a8"/><text x="64" y="433.78" font-size="29" font-weight="700" fill="#2563a8" text-anchor="start"><tspan x="64" dy="0">删除：已核对归属的中间文件</tspan></text><text x="64" y="476.35999999999996" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="64" dy="0">独立测试缓存与临时目录</tspan><tspan x="64" dy="32.199999999999996">重复前端依赖副本及构建中间层</tspan><tspan x="64" dy="32.199999999999996">重复源码包与测试辅助文件</tspan></text><rect x="624" y="390" width="532" height="270" rx="16" fill="#e9f7f3" stroke="#d9e3e9" stroke-width="1.5"/><rect x="624" y="407" width="5" height="236" rx="2.5" fill="#087f80"/><text x="644" y="433.78" font-size="29" font-weight="700" fill="#087f80" text-anchor="start"><tspan x="644" dy="0">保留：服务、状态与必要证据</tspan></text><text x="644" y="476.35999999999996" font-size="23" font-weight="400" fill="#536a7c" text-anchor="start"><tspan x="644" dy="0">当前源码、依赖树、候选构建</tspan><tspan x="644" dy="32.199999999999996">数据库备份、密钥、日志与摘要</tspan><tspan x="644" dy="32.199999999999996">运行容器、持久卷、在用镜像</tspan></text><text x="600" y="727" font-size="29" font-weight="700" fill="#087f80" text-anchor="middle"><tspan x="600" dy="0">Docker 删除：容器 0  ·  镜像 0  ·  数据卷 0</tspan></text><text x="600" y="776" font-size="24" font-weight="400" fill="#536a7c" text-anchor="middle"><tspan x="600" dy="0">目录链接与共享缓存单独核对，不盲目递归或全局 prune</tspan></text></svg>